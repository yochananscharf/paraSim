<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="meatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Shield / Disc -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2"/>

  <!-- Stylized Bovine Silhouette & Anatomy -->
  <g filter="url(#shadow)">
    <!-- Horns -->
    <path d="M14 26 C12 18, 16 11, 22 13 C20 17, 21 21, 23 23" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M50 26 C52 18, 48 11, 42 13 C44 17, 43 21, 41 23" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Ears -->
    <path d="M12 28 C9 30, 8 34, 13 36 C16 35, 18 32, 19 30 Z" fill="#cbd5e1"/>
    <path d="M52 28 C55 30, 56 34, 51 36 C48 35, 46 32, 45 30 Z" fill="#cbd5e1"/>

    <!-- Cow Head Crown & Face Contour -->
    <path d="M22 22 L42 22 L44 32 L39 44 L25 44 L20 32 Z" fill="#f8fafc"/>

    <!-- Muscular & Anatomical Heart / Meat Accent in Center of Forehead / Chest -->
    <path d="M32 26 C30 23, 26 23, 26 27 C26 32, 32 36, 32 36 C32 36, 38 32, 38 27 C38 23, 34 23, 32 26 Z" fill="url(#meatGrad)"/>

    <!-- Eyes -->
    <circle cx="26" cy="33" r="2.2" fill="#0f172a"/>
    <circle cx="38" cy="33" r="2.2" fill="#0f172a"/>
    <circle cx="25.4" cy="32.4" r="0.8" fill="#ffffff"/>
    <circle cx="37.4" cy="32.4" r="0.8" fill="#ffffff"/>

    <!-- Muzzle / Snout -->
    <path d="M25 43 C25 40, 39 40, 39 43 L38 52 C38 55, 26 55, 26 52 Z" fill="#fbcfe8"/>
    <!-- Nostrils -->
    <ellipse cx="29" cy="48" rx="1.8" ry="2.2" fill="#831843"/>
    <ellipse cx="35" cy="48" rx="1.8" ry="2.2" fill="#831843"/>
  </g>
</svg>
